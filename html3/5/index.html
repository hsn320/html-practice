<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
</head>
<body>
    <h1>フォーム</h1>
    <form>
        <p>
            <label>お名前</label>
            <input type="text" name="name" placeholder="例）山田太郎">
        </p>
        <p>
            <label>メールアドレス</label>
            <input type="email" name="email" placeholder="例）yamada@.com">
        </p>
        <p>
            <label>年齢</label>
            <input type="number" name="age" placeholder="例）22">
        </p>
        <p>
            <button type="button">送信</button>
            <button type="reset">リセット</button>
        </p>
    </form>
</body>
</html>
